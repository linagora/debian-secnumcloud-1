# Nettoyage de l'image disque finale, inclus par mkosi.conf.
# core garde tout : l'image disque et les futures extensions installent par-dessus.

[Content]
# /usr/lib/modules/*/vmlinuz reste : mkosi le lit après RemoveFiles= pour construire l'UKI.
RemoveFiles=
		/usr/share/doc
		/usr/share/man
		/usr/src

# Modules noyau : '/' ajoute tout. '-' retirent individuellement
# Resultat : image de test legere.
# On suit le prototype dans un premier temps. On garde juste le GPU pour l'affichage graphique
# L'image Desktop remettra certain modules.
KernelModules=
		/
		-/sound/
		-/drivers/infiniband/
		-/drivers/iio/
		-/drivers/media/
		-/drivers/net/wireless/
		
