[Distribution]
Architecture=x86-64

[Output]
# Must live here, after Architecture= above, so `%a` expands to x86-64. In the
# top-level mkosi.conf it would expand to the host arch. See mkosi(1).
Output=%i_%v_%a

[Content]
Packages=
        linux-image-cloud-amd64
        qemu-guest-agent
