# The dpkg database is on /usr (finalize-dpkg), read-only: link it here, except
# the status file, which dpkg-status.service merges from status.d/ (the image
# and its system extensions). L, not L+: mkosi applies tmpfiles.d to the build
# tree before finalize-dpkg moves the database, where these entries are real.
# tmpfiles creates /var/lib/dpkg itself.

L /var/lib/dpkg/alternatives - - - - /usr/lib/sysimage/dpkg/alternatives
L /var/lib/dpkg/arch-native - - - - /usr/lib/sysimage/dpkg/arch-native
L /var/lib/dpkg/available - - - - /usr/lib/sysimage/dpkg/available
L /var/lib/dpkg/diversions - - - - /usr/lib/sysimage/dpkg/diversions
L /var/lib/dpkg/info - - - - /usr/lib/sysimage/dpkg/info
L /var/lib/dpkg/parts - - - - /usr/lib/sysimage/dpkg/parts
L /var/lib/dpkg/statoverride - - - - /usr/lib/sysimage/dpkg/statoverride
L /var/lib/dpkg/triggers - - - - /usr/lib/sysimage/dpkg/triggers
L /var/lib/dpkg/updates - - - - /usr/lib/sysimage/dpkg/updates
