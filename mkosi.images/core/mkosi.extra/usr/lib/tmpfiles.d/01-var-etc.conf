# Entrees de /etc qui restent modifiables : finalize-etx les déplace au build
# dans /usr/share/factory/var/etc et met un lie /etc/<x> -> /var/etc/<x>

d /var/etc 0755 root root -
C! /var/etc/crypttab
C! /var/etc/host.conf
C! /var/etc/hosts
C! /var/etc/issue
C! /var/etc/issue.d
C! /var/etc/locale.conf
C! /var/etc/motd.d
C! /var/etc/vconsole.conf
C! /var/etc/sysupdate.d
C! /var/etc/userdb
C! /var/etc/credstore
C! /var/etc/credstore.encrypted
d /var/etc/ssh 0755 root root -
