# Partition /var : creee par systemd-repart au 1er demarrage dans l'espace libre
# Seule zone en écriture .
[Partition]
Type=var
Format=ext4
SizeMinBytes=1G
# Pas de SizeMaxBytes -> Prend tout ce qui reste
Weight=20000
#Sources des montages /home et /root et des journaux (logs)
MakeDirectories=/log/journal /home /roothome

# /etc/machine-id -> /var/lib/dbus/machine-id. "uninitialized" fait de ce
# demarrage le premier. PID 1 genere l'id et l'ecrit dans ce fichier.
CopyFiles=/usr/share/factory/var/lib/dbus/machine-id:/lib/dbus/machine-id

FactoryReset=yes
Label=%M-var
