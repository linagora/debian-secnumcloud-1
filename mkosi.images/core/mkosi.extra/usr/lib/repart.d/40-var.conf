# Partition /var : creee par systemd-repart au 1er demarrage dans l'espace libre
# Seule zone en écriture .
[Partition]
Type=var
Format=ext4
SizeMinBytes=1G
# Pas de SizeMaxBytes -> Prend tout ce qui reste
Weight=20000
#Sources des montages /home et /root et des journaux (logs)
MakeDirectories=/log/journal /home /roothome
FactoryReset=yes
Label=%M-var
