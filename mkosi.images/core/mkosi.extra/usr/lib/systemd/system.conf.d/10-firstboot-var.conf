# Chemin ou firstboot, hostnamed, localed et imedated ecrivent (a la palce de /etc)

[Manager]
DefaultEnvironment=SYSTEMD_ETC_HOSTNAME=/var/etc/hostname \
				   SYSTEMD_ETC_MACHINE_INFO=/var/etc/machine-info \
				   SYSTEMD_ETC_LOCALE_CONF=/var/etc/locale.conf \
				   SYSTEMD_ETC_VCONSOLE_CONF=/var/etc/vconsole.conf \
				   SYSTEMD_ETC_LOCALTIME=/var/etc/localtime
