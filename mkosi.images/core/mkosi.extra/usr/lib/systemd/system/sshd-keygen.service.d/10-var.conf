# Clef d'hote generee au premier demarrage das /var/etc/ssh au lieu de /etc/ssh
[Unit]
ConditionPathIsReadWrite=
ConditionPathExists=!/var/etc/ssh/ssh_host_ed25519_key
RequiresMountsFor=/var/etc/ssh
After=systemd-tmpfiles-setup.service

[Service]
ExecStart=
ExecStart=ssh-keygen -q -t ed25519 -N "" -C "" -f /var/etc/ssh/ssh_host_ed25519_key
