[Content]
# Bibliothèques TPM2 chargées par systemd (dlopen) : mesures PCR, systemd-cryptenroll, credentials...
# Ce sont des "Recommends" de systemd, donc absentes avec WithRecommends=no
# Les noms contiennent la version de l'ABI : à revoir si tpm2-tss change d'ABI dans forky
Packages=
        libtss2-esys-3.0.2-0t64
        libtss2-mu-4.0.1-0t64
        libtss2-rc0t64
        libtss2-tcti-device0t64
