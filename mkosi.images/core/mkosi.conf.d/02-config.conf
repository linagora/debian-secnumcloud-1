[Content]
# Pas de Hostname=, Locale=, Keymap=, Timezone= : systemd-firstboot les demande au premier demarrage
# (ou les reçoit en credentials, voir "just vm-create")

# openssh-server génère ses clés d'hôte à l'installation : ne pas les livrer (toutes les machines
# auraient les mêmes), sshd-keygen.service les régénère au premier démarrage

RemoveFiles=/etc/ssh/ssh_host_*

# Reglages poses par les paquets (tzdata...) : les retirer pour que systemd-firstboot les demande
# Peut-etre a supprimer plus tard avec une config par defaut
RemoveFiles=/etc/localtime /etc/timezone /etc/locale.conf
