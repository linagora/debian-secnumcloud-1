# Autologin root sur la console série ttyS0 (just vm-console).
# Autologin=yes de mkosi ne couvre que tty1, hvc0 et console-getty : même réglage, pour ttyS0.
[Service]
ExecStart=
ExecStart=-agetty -o '-f -p -- \\u' --autologin root --keep-baud 115200,57600,38400,9600 - $TERM
StandardInput=tty
StandardOutput=tty
