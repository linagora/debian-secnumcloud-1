[project]

# General Informations
site_name = "Debian SecNumCloud"
site_url = "https://linagora.github.io/debian-secnumcloud-1/"
site_description = "Documentation for the Debian SecNumCloud project"
site_author = "Linagora"
copyright = "Copyright &copy; 2026 Linagora"

# Repo informations
repo_name = "linagora/debian-secnumcloud-1"
repo_url = "https://github.com/linagora/debian-secnumcloud-1"
edit_uri = "edit/main/docs/"

# Navigation structure
# Every new page must be added here (see development/contributing-docs.md)
nav = [
    { "Home" = [
        "index.md",
    ] },
    { "Getting started" = [
        "getting-started/index.md",
        "getting-started/build.md",
        "getting-started/vm.md",
    ] },
    { "Installation" = [
        "installation/index.md",
    ] },
    { "Administration" = [
        "administration/index.md",
        "administration/keys.md",
        "administration/yubikey.md",
        "administration/updates.md",
        "administration/extensions.md",
        "administration/recovery.md",
    ] },
    { "Security" = [
        "security/index.md",
        "security/security-design.md",
        "security/apparmor.md",
        "security/ipe.md",
    ] },
    { "Development" = [
        "development/index.md",
        "development/repository.md",
        "development/tests.md",
        "development/contributing.md",
        "development/contributing-docs.md",
        { "ADR" = [
            "adr/index.md",
            "adr/template.md",
            "adr/0001-documentation-tool-zensical.md",
            "adr/0002-hosting-github-pages.md",
        ] },
    ] },
    { "R&D journal" = [
        "rd-journal/index.md",
        "rd-journal/template.md",
    ] },
]

# Theme of documentation
[project.theme]
language = "en"
features = [
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.tabs.link",
    "content.tooltips",
    "navigation.indexes",
    "navigation.instant",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

# Markdown extensions
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

# Activate Light/Dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/linagora/debian-secnumcloud-1"
