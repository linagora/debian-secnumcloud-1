# Replace sulogin with bash so the emergency console is reachable.
#
# Neither RootPassword= nor SYSTEMD_SULOGIN_FORCE=1 succeeded at making
# sulogin spawn a usable shell on this initrd. Skip sulogin entirely:
# emergency.service now runs bash directly on /dev/console.
# DEV ONLY: production initrd should keep sulogin.
[Service]
Environment=SYSTEMD_SULOGIN_FORCE=1
ExecStart=
ExecStart=/bin/bash
StandardInput=tty-force
StandardOutput=tty
StandardError=tty
TTYPath=/dev/console
TTYReset=yes
TTYVHangup=yes
