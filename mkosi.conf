[Config]
# Version de mkosi pour build l'image -- fail si version antérieure
MinimumVersion=27

[Include]
# Nettoyage de l'image disque
Include=%D/clean.conf

[Distribution]
# Les infos sur la distribution qu'on est en train de build
Distribution=debian
Release=forky
Architecture=x86-64
Repositories=non-free-firmware

[Output]
# Les infos pour la création de l'image
ImageId=CCBDos
Output=%i_%v_%a
Format=disk
OutputDirectory=mkosi.output

[Build]
CacheDirectory=mkosi.cache
# mkosi construit l'outil de build -- le build devient indépendant de la machine -- normalement
ToolsTree=default
ToolsTreeDistribution=debian
ToolsTreeRelease=unstable
ToolsTreePackages=udev
History=yes
Incremental=yes

[Content]
BaseTrees=%O/core
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImageFormat=%i_%v_%a
# Console série (just vm-console) + écran (just vm-gui) ; la dernière console= reçoit /dev/console,
# donc l'assistant de premier démarrage s'affiche à l'écran
KernelCommandLine=
        root=dissect
        ro
        systemd.image_policy=esp=unprotected:root=signed:swap=unprotected+absent:=ignore
        console=ttyS0
        console=tty0
Packages=
        systemd-boot
        systemd-boot-efi
